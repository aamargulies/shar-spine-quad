<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Prefetch: ask for what you'll need a few steps ahead</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#666" font-style="italic">Like putting the kettle on before you sit down. The wait overlaps with everything else.</text>

  <!-- =================== PANEL 1 NAIVE =================== -->
  <text x="40" y="94" font-size="16" font-weight="bold" fill="#1a1a1a">1. Naive: ask, WAIT, use. Three times over.</text>

  <!-- Labels above blocks -->
  <text x="105" y="124" text-anchor="middle" font-size="10" fill="#1565c0">use</text>
  <text x="235" y="124" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">wait for DRAM</text>
  <text x="365" y="124" text-anchor="middle" font-size="10" fill="#1565c0">use</text>
  <text x="495" y="124" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">wait for DRAM</text>
  <text x="625" y="124" text-anchor="middle" font-size="10" fill="#1565c0">use</text>
  <text x="755" y="124" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">wait for DRAM</text>

  <!-- Timeline blocks: compute = 30w blue, wait = 230w red -->
  <g>
    <rect x="90"  y="132" width="30"  height="44" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
    <rect x="120" y="132" width="230" height="44" fill="#ffcdd2" stroke="#c62828" stroke-width="1.2"/>
    <rect x="350" y="132" width="30"  height="44" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
    <rect x="380" y="132" width="230" height="44" fill="#ffcdd2" stroke="#c62828" stroke-width="1.2"/>
    <rect x="610" y="132" width="30"  height="44" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
    <rect x="640" y="132" width="230" height="44" fill="#ffcdd2" stroke="#c62828" stroke-width="1.2"/>
  </g>

  <!-- Time axis for panel 1 -->
  <line x1="90" y1="195" x2="870" y2="195" stroke="#555" stroke-width="1" marker-end="url(#arrow-gray)"/>
  <text x="90" y="213" font-size="11" fill="#555">start</text>
  <text x="480" y="213" text-anchor="middle" font-size="11" fill="#555">time (longer is worse)</text>
  <text x="868" y="213" text-anchor="end" font-size="11" fill="#c62828" font-weight="bold">finish, slow</text>

  <!-- "panel 2 finishes here" marker, for comparison -->
  <line x1="400" y1="128" x2="400" y2="198" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="400" y="240" text-anchor="middle" font-size="10" fill="#2e7d32" font-style="italic">(with prefetch, we'd already be finished here)</text>

  <!-- =================== PANEL 2 PREFETCH =================== -->
  <text x="40" y="283" font-size="16" font-weight="bold" fill="#1a1a1a">2. With prefetch (the spine): fire the loads early. They overlap with work.</text>

  <!-- CPU lane -->
  <text x="82" y="330" text-anchor="end" font-size="11" fill="#555" font-weight="bold">CPU</text>
  <rect x="90" y="310" width="310" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
  <text x="245" y="334" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">scan spine + compute (never stalls)</text>

  <!-- Memory lane: 3 loads, slightly staggered, running in parallel -->
  <text x="82" y="398" text-anchor="end" font-size="11" fill="#555" font-weight="bold">Memory</text>
  <rect x="95"  y="370" width="225" height="16" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="207" y="382" text-anchor="middle" font-size="10" fill="#e65100">load 1 (fired early)</text>
  <rect x="120" y="390" width="225" height="16" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="232" y="402" text-anchor="middle" font-size="10" fill="#e65100">load 2</text>
  <rect x="145" y="410" width="225" height="16" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="257" y="422" text-anchor="middle" font-size="10" fill="#e65100">load 3</text>

  <!-- Time axis for panel 2 (same scale as panel 1) -->
  <line x1="90" y1="445" x2="870" y2="445" stroke="#555" stroke-width="1" marker-end="url(#arrow-gray)"/>
  <text x="90" y="463" font-size="11" fill="#555">start</text>
  <text x="400" y="463" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">finish, fast ✓</text>

  <!-- finish marker -->
  <line x1="400" y1="305" x2="400" y2="448" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="480" y="487" text-anchor="middle" font-size="12" fill="#555">Three memory loads run in parallel under the CPU's work. The hardware prefetcher issues them automatically.</text>

  <!-- =================== PANEL 3 SPINE LAYOUT =================== -->
  <text x="40" y="528" font-size="16" font-weight="bold" fill="#1a1a1a">3. The "spine": a tiny sampled index packed at the start of memory</text>

  <!-- Full array bar -->
  <rect x="90" y="560" width="780" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
  <!-- Spine portion (first ~4 cache lines) highlighted -->
  <rect x="90" y="560" width="60" height="40" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <!-- Subdivide spine into 4 to suggest cache lines -->
  <g stroke="#2e7d32" stroke-width="0.8" opacity="0.7">
    <line x1="105" y1="560" x2="105" y2="600"/>
    <line x1="120" y1="560" x2="120" y2="600"/>
    <line x1="135" y1="560" x2="135" y2="600"/>
  </g>

  <!-- Labels -->
  <text x="120" y="553" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">spine (~4 cache lines)</text>
  <text x="510" y="585" text-anchor="middle" font-size="12" fill="#1565c0">full sorted array, 4,096 elements</text>

  <!-- Sequential-scan arrow under the spine -->
  <line x1="93" y1="622" x2="147" y2="622" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="120" y="640" text-anchor="middle" font-size="10" fill="#2e7d32">sequential scan</text>

  <!-- Callout arrow pointing to next cache line -->
  <line x1="150" y1="615" x2="205" y2="615" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <text x="300" y="618" font-size="11" fill="#2e7d32" font-style="italic">stride prefetcher grabs the next line for free</text>

  <!-- Bottom summary line -->
  <text x="480" y="685" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">Same mechanical-sympathy goal as Eytzinger's prefetch discipline. Different execution.</text>

</svg>
