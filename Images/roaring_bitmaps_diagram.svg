<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Roaring Bitmaps: two levels, two very different search problems</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#666" font-style="italic">The high 16 bits pick a container; the low 16 bits get searched inside it. Each level gets its own optimization.</text>

  <!-- =================== SECTION 1: 32-bit split =================== -->
  <text x="40" y="88" font-size="15" font-weight="bold" fill="#1a1a1a">① Split every 32-bit integer into two halves</text>

  <text x="250" y="122" text-anchor="end" font-family="Menlo, Monaco, monospace" font-size="14" fill="#333">x = 0xABCD1234</text>

  <!-- 32-bit word, split colored halves -->
  <g transform="translate(260, 102)">
    <rect x="0" y="0" width="200" height="32" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1.3"/>
    <rect x="200" y="0" width="200" height="32" fill="#bbdefb" stroke="#1976d2" stroke-width="1.3"/>
    <text x="100" y="21" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="13" fill="#4a148c" font-weight="bold">hi = 0xABCD</text>
    <text x="300" y="21" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="13" fill="#1565c0" font-weight="bold">lo = 0x1234</text>
  </g>

  <!-- Split function arrows / labels -->
  <text x="360" y="152" text-anchor="middle" font-size="11" fill="#4a148c">picks which container</text>
  <text x="560" y="152" text-anchor="middle" font-size="11" fill="#1565c0">searched inside it</text>

  <!-- =================== SECTION 2: Outer level =================== -->
  <text x="40" y="188" font-size="15" font-weight="bold" fill="#1a1a1a">② Outer level: two parallel arrays (the hi keys drive a short branchless search)</text>

  <!-- keys[] strip -->
  <text x="40" y="214" font-size="12" font-weight="bold" fill="#4a148c">keys[]</text>
  <text x="40" y="228" font-size="10" fill="#4a148c" font-style="italic">sorted u16 high-halves</text>
  <rect x="120" y="204" width="600" height="28" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.3"/>
  <g stroke="#6a1b9a" stroke-width="0.5" opacity="0.4">
    <line x1="160" y1="204" x2="160" y2="232"/>
    <line x1="200" y1="204" x2="200" y2="232"/>
    <line x1="240" y1="204" x2="240" y2="232"/>
    <line x1="280" y1="204" x2="280" y2="232"/>
    <line x1="320" y1="204" x2="320" y2="232"/>
    <line x1="360" y1="204" x2="360" y2="232"/>
    <line x1="400" y1="204" x2="400" y2="232"/>
    <line x1="440" y1="204" x2="440" y2="232"/>
    <line x1="480" y1="204" x2="480" y2="232"/>
    <line x1="520" y1="204" x2="520" y2="232"/>
    <line x1="560" y1="204" x2="560" y2="232"/>
    <line x1="600" y1="204" x2="600" y2="232"/>
    <line x1="640" y1="204" x2="640" y2="232"/>
    <line x1="680" y1="204" x2="680" y2="232"/>
  </g>
  <!-- highlight the matched key -->
  <rect x="440" y="202" width="40" height="32" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="460" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">hi = 0xABCD</text>
  <text x="730" y="222" font-size="11" fill="#4a148c">~512 entries = 1 KB</text>

  <!-- containers[] strip -->
  <text x="40" y="278" font-size="12" font-weight="bold" fill="#1565c0">containers[]</text>
  <text x="40" y="292" font-size="10" fill="#1565c0" font-style="italic">parallel pointers</text>
  <rect x="120" y="268" width="600" height="28" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.3"/>
  <g stroke="#1976d2" stroke-width="0.5" opacity="0.4">
    <line x1="160" y1="268" x2="160" y2="296"/>
    <line x1="200" y1="268" x2="200" y2="296"/>
    <line x1="240" y1="268" x2="240" y2="296"/>
    <line x1="280" y1="268" x2="280" y2="296"/>
    <line x1="320" y1="268" x2="320" y2="296"/>
    <line x1="360" y1="268" x2="360" y2="296"/>
    <line x1="400" y1="268" x2="400" y2="296"/>
    <line x1="440" y1="268" x2="440" y2="296"/>
    <line x1="480" y1="268" x2="480" y2="296"/>
    <line x1="520" y1="268" x2="520" y2="296"/>
    <line x1="560" y1="268" x2="560" y2="296"/>
    <line x1="600" y1="268" x2="600" y2="296"/>
    <line x1="640" y1="268" x2="640" y2="296"/>
    <line x1="680" y1="268" x2="680" y2="296"/>
  </g>
  <rect x="440" y="266" width="40" height="32" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="730" y="286" font-size="11" fill="#1565c0">one pointer per key</text>

  <!-- Arrow from matched key down to pointer -->
  <line x1="460" y1="234" x2="460" y2="264" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arr-orange)"/>

  <!-- Arrow from matched pointer down to containers section -->
  <line x1="460" y1="298" x2="460" y2="388" stroke="#1565c0" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="472" y="340" font-size="11" fill="#1565c0">containers[i] →</text>

  <!-- Outer perf callout -->
  <g>
    <rect x="40" y="316" width="400" height="52" fill="#fff8e1" stroke="#b8860b" stroke-width="1.2" rx="4"/>
    <text x="50" y="334" font-size="12" font-weight="bold" fill="#b8860b">Perf: 1 KB of keys is too small for stride prefetchers.</text>
    <text x="50" y="351" font-size="11" fill="#333">Textbook bsearch has a mispredict per step. An "outer spine"</text>
    <text x="50" y="365" font-size="11" fill="#333">disappoints. <tspan font-weight="bold">Shar's 1971 branchless cmov chain wins on all 6 hosts.</tspan></text>
  </g>

  <!-- =================== SECTION 3: Three container types =================== -->
  <text x="40" y="412" font-size="15" font-weight="bold" fill="#1a1a1a">③ Inner level: one of three container types, chosen by cardinality</text>

  <!-- Column 1: Array container (this project's focus) -->
  <g transform="translate(40, 428)">
    <rect x="0" y="0" width="280" height="184" fill="#fff3e0" stroke="#e65100" stroke-width="1.8" rx="5"/>
    <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">Array container ★</text>
    <text x="140" y="36" text-anchor="middle" font-size="11" fill="#bf360c" font-style="italic">cardinality ≤ 4096</text>

    <!-- visual: sorted u16 cells -->
    <rect x="14" y="52" width="252" height="26" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
    <g stroke="#e65100" stroke-width="0.5" opacity="0.4">
      <line x1="30"  y1="52" x2="30"  y2="78"/>
      <line x1="46"  y1="52" x2="46"  y2="78"/>
      <line x1="62"  y1="52" x2="62"  y2="78"/>
      <line x1="78"  y1="52" x2="78"  y2="78"/>
      <line x1="94"  y1="52" x2="94"  y2="78"/>
      <line x1="110" y1="52" x2="110" y2="78"/>
      <line x1="126" y1="52" x2="126" y2="78"/>
      <line x1="142" y1="52" x2="142" y2="78"/>
      <line x1="158" y1="52" x2="158" y2="78"/>
      <line x1="174" y1="52" x2="174" y2="78"/>
      <line x1="190" y1="52" x2="190" y2="78"/>
      <line x1="206" y1="52" x2="206" y2="78"/>
      <line x1="222" y1="52" x2="222" y2="78"/>
      <line x1="238" y1="52" x2="238" y2="78"/>
      <line x1="254" y1="52" x2="254" y2="78"/>
    </g>
    <text x="140" y="94" text-anchor="middle" font-size="10" fill="#bf360c">sorted uint16_t of low-halves</text>

    <text x="14" y="118" font-size="11" font-weight="bold" fill="#bf360c">Inner search: simd_quad</text>
    <text x="14" y="134" font-size="10" fill="#333">quaternary descent + 16-way</text>
    <text x="14" y="148" font-size="10" fill="#333">SIMD compare. 4-line spine</text>
    <text x="14" y="162" font-size="10" fill="#333">makes the 3 dependent loads</text>
    <text x="14" y="176" font-size="10" fill="#333">streamer-friendly. <tspan font-weight="bold" fill="#bf360c">This project.</tspan></text>
  </g>

  <!-- Column 2: Bitset container -->
  <g transform="translate(340, 428)">
    <rect x="0" y="0" width="280" height="184" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" rx="5"/>
    <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Bitset container</text>
    <text x="140" y="36" text-anchor="middle" font-size="11" fill="#1565c0" font-style="italic">cardinality &gt; 4096</text>

    <!-- visual: a small grid of bits -->
    <g transform="translate(40, 52)">
      <rect x="0" y="0" width="200" height="30" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
      <g stroke="#1976d2" stroke-width="0.4" opacity="0.5">
        <line x1="12.5" y1="0" x2="12.5" y2="30"/>
        <line x1="25"   y1="0" x2="25"   y2="30"/>
        <line x1="37.5" y1="0" x2="37.5" y2="30"/>
        <line x1="50"   y1="0" x2="50"   y2="30"/>
        <line x1="62.5" y1="0" x2="62.5" y2="30"/>
        <line x1="75"   y1="0" x2="75"   y2="30"/>
        <line x1="87.5" y1="0" x2="87.5" y2="30"/>
        <line x1="100"  y1="0" x2="100"  y2="30"/>
        <line x1="112.5" y1="0" x2="112.5" y2="30"/>
        <line x1="125"  y1="0" x2="125"  y2="30"/>
        <line x1="137.5" y1="0" x2="137.5" y2="30"/>
        <line x1="150"  y1="0" x2="150"  y2="30"/>
        <line x1="162.5" y1="0" x2="162.5" y2="30"/>
        <line x1="175"  y1="0" x2="175"  y2="30"/>
        <line x1="187.5" y1="0" x2="187.5" y2="30"/>
        <line x1="0" y1="15" x2="200" y2="15"/>
      </g>
    </g>
    <text x="140" y="94" text-anchor="middle" font-size="10" fill="#1565c0">2^16 bits, one per possible low-half</text>

    <text x="14" y="118" font-size="11" font-weight="bold" fill="#1565c0">Inner search: bit-test</text>
    <text x="14" y="134" font-size="10" fill="#333">bitmap[lo &gt;&gt; 6] &amp; (1 &lt;&lt; (lo &amp; 63))</text>
    <text x="14" y="148" font-size="10" fill="#333">O(1), one load plus a shift.</text>
    <text x="14" y="162" font-size="10" fill="#333">Fixed 8 KB. Dense sets go here</text>
    <text x="14" y="176" font-size="10" fill="#333">because they're cheaper than array.</text>
  </g>

  <!-- Column 3: Run container -->
  <g transform="translate(640, 428)">
    <rect x="0" y="0" width="280" height="184" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="5"/>
    <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Run container</text>
    <text x="140" y="36" text-anchor="middle" font-size="11" fill="#1b5e20" font-style="italic">when RLE compresses best</text>

    <!-- visual: a few (start, length) pairs as boxes -->
    <g transform="translate(14, 52)">
      <rect x="0"  y="0" width="36" height="26" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
      <rect x="36" y="0" width="22" height="26" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1"/>
      <rect x="66" y="0" width="36" height="26" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
      <rect x="102" y="0" width="22" height="26" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1"/>
      <rect x="132" y="0" width="36" height="26" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
      <rect x="168" y="0" width="22" height="26" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1"/>
      <rect x="198" y="0" width="36" height="26" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
      <rect x="234" y="0" width="22" height="26" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1"/>
    </g>
    <text x="140" y="94" text-anchor="middle" font-size="10" fill="#1b5e20">(start, length) pairs</text>

    <text x="14" y="118" font-size="11" font-weight="bold" fill="#1b5e20">Inner search: bsearch on runs</text>
    <text x="14" y="134" font-size="10" fill="#333">binary-search for run whose</text>
    <text x="14" y="148" font-size="10" fill="#333">start ≤ lo, then check lo is in</text>
    <text x="14" y="162" font-size="10" fill="#333">[start, start + length). Best</text>
    <text x="14" y="176" font-size="10" fill="#333">when values form long intervals.</text>
  </g>

  <!-- =================== FOOTER: performance summary =================== -->
  <g>
    <rect x="40" y="628" width="880" height="80" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5" rx="5"/>
    <text x="480" y="650" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">The two-level split is the performance win.</text>
    <text x="480" y="670" text-anchor="middle" font-size="12" fill="#333">Outer and inner are independent optimization problems with different working sets, different access patterns,</text>
    <text x="480" y="686" text-anchor="middle" font-size="12" fill="#333">and different ideal algorithms. The u16 values compress 2× because the high half is implicit in which container you land in.</text>
    <text x="480" y="702" text-anchor="middle" font-size="12" font-style="italic" fill="#b8860b">Variant F: Shar branchless outer (1 KB, few parallel loads) + SIMD quad inner (8 KB, streamer + vectors). Ships on all 6 hosts.</text>
  </g>

</svg>
