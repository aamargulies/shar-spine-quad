<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">SIMD Quad Search: a visual walkthrough</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#666">finding a target in a sorted array of 4,096 × 16-bit unsigned integers</text>

  <!-- ===================== STAGE 1 ===================== -->
  <text x="40" y="94" font-size="16" font-weight="bold" fill="#1a1a1a">① The array</text>
  <rect x="40" y="104" width="880" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="50" y="124" font-size="12" fill="#1565c0">low</text>
  <text x="910" y="124" text-anchor="end" font-size="12" fill="#1565c0">high</text>
  <text x="480" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">4,096 sorted numbers</text>

  <!-- ===================== STAGE 2 ===================== -->
  <text x="40" y="170" font-size="16" font-weight="bold" fill="#1a1a1a">② Split into 256 blocks of 16. The last element of each block becomes a "key".</text>

  <!-- blocks: 3 shown, ellipsis, block 256. Each block 112 wide (105 data + 7 key), 32 tall. -->
  <g transform="translate(165, 192)">
    <rect x="0" y="0" width="105" height="32" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
    <rect x="105" y="0" width="7" height="32" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
    <text x="56" y="50" text-anchor="middle" font-size="11" fill="#555">block 1</text>
  </g>
  <g transform="translate(285, 192)">
    <rect x="0" y="0" width="105" height="32" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
    <rect x="105" y="0" width="7" height="32" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
    <text x="56" y="50" text-anchor="middle" font-size="11" fill="#555">block 2</text>
  </g>
  <g transform="translate(405, 192)">
    <rect x="0" y="0" width="105" height="32" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
    <rect x="105" y="0" width="7" height="32" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
    <text x="56" y="50" text-anchor="middle" font-size="11" fill="#555">block 3</text>
  </g>
  <text x="600" y="214" text-anchor="middle" font-size="26" fill="#888">· · ·</text>
  <g transform="translate(683, 192)">
    <rect x="0" y="0" width="105" height="32" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
    <rect x="105" y="0" width="7" height="32" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
    <text x="56" y="50" text-anchor="middle" font-size="11" fill="#555">block 256</text>
  </g>

  <!-- key-cell callout (moved below the blocks so it no longer collides with the ② header) -->
  <line x1="513" y1="270" x2="513" y2="226" stroke="#e65100" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
  <text x="513" y="282" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">the orange cell is the "key" (biggest value in the block)</text>

  <!-- caption -->
  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#555">16 numbers per block · 256 blocks × 16 = 4,096</text>

  <!-- ===================== STAGE 3 ===================== -->
  <text x="40" y="335" font-size="16" font-weight="bold" fill="#1a1a1a">③ Search the 256 keys with quaternary interpolation (a few steps pick one block)</text>

  <!-- keys strip -->
  <rect x="40" y="355" width="880" height="22" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <!-- a few tick marks to suggest "many keys" -->
  <g stroke="#e65100" stroke-width="0.6" opacity="0.55">
    <line x1="95" y1="355" x2="95" y2="377"/>
    <line x1="150" y1="355" x2="150" y2="377"/>
    <line x1="205" y1="355" x2="205" y2="377"/>
    <line x1="260" y1="355" x2="260" y2="377"/>
    <line x1="315" y1="355" x2="315" y2="377"/>
    <line x1="370" y1="355" x2="370" y2="377"/>
    <line x1="425" y1="355" x2="425" y2="377"/>
    <line x1="480" y1="355" x2="480" y2="377"/>
    <line x1="535" y1="355" x2="535" y2="377"/>
    <line x1="590" y1="355" x2="590" y2="377"/>
    <line x1="645" y1="355" x2="645" y2="377"/>
    <line x1="700" y1="355" x2="700" y2="377"/>
    <line x1="755" y1="355" x2="755" y2="377"/>
    <line x1="810" y1="355" x2="810" y2="377"/>
    <line x1="865" y1="355" x2="865" y2="377"/>
  </g>
  <text x="50" y="371" font-size="11" fill="#e65100" font-weight="bold">key 1</text>
  <text x="910" y="371" text-anchor="end" font-size="11" fill="#e65100" font-weight="bold">key 256</text>

  <!-- 4 probe arrows (the "quad" in quad search) -->
  <g>
    <line x1="216" y1="327" x2="216" y2="353" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <line x1="392" y1="327" x2="392" y2="353" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <line x1="568" y1="327" x2="568" y2="353" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <line x1="744" y1="327" x2="744" y2="353" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  </g>
  <text x="480" y="405" text-anchor="middle" font-size="12" fill="#c62828">4 probes at a time narrow the range · repeat ~3× to land on one block</text>

  <!-- highlight "found block" on the strip -->
  <rect x="684" y="351" width="18" height="30" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <line x1="693" y1="427" x2="693" y2="384" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
  <text x="693" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">target is in this block</text>

  <!-- ===================== STAGE 4 ===================== -->
  <text x="40" y="475" font-size="16" font-weight="bold" fill="#1a1a1a">④ SIMD: one instruction compares the target to all 16 elements of that block, at the same time</text>

  <!-- target box -->
  <rect x="420" y="497" width="120" height="32" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="480" y="518" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">target value</text>

  <!-- 16 parallel "compare" arrows from target down to each cell of the zoomed block -->
  <g stroke="#2e7d32" stroke-width="0.9" opacity="0.55">
    <line x1="480" y1="529" x2="255" y2="585"/>
    <line x1="480" y1="529" x2="285" y2="585"/>
    <line x1="480" y1="529" x2="315" y2="585"/>
    <line x1="480" y1="529" x2="345" y2="585"/>
    <line x1="480" y1="529" x2="375" y2="585"/>
    <line x1="480" y1="529" x2="405" y2="585"/>
    <line x1="480" y1="529" x2="435" y2="585"/>
    <line x1="480" y1="529" x2="465" y2="585"/>
    <line x1="480" y1="529" x2="495" y2="585"/>
    <line x1="480" y1="529" x2="525" y2="585"/>
    <line x1="480" y1="529" x2="555" y2="585"/>
    <line x1="480" y1="529" x2="585" y2="585"/>
    <line x1="480" y1="529" x2="615" y2="585"/>
    <line x1="480" y1="529" x2="645" y2="585"/>
    <line x1="480" y1="529" x2="675" y2="585"/>
    <line x1="480" y1="529" x2="705" y2="585"/>
  </g>

  <!-- zoomed-in block of 16 cells (30 wide × 50 tall each; data cells 0-14, key cell 15) -->
  <g transform="translate(240, 587)">
    <rect x="0" y="0" width="450" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
    <rect x="450" y="0" width="30" height="50" fill="#ffcc80" stroke="#e65100" stroke-width="1.2"/>
    <!-- 15 internal vertical divisions to imply 16 cells -->
    <g stroke="#1976d2" stroke-width="0.6" opacity="0.55">
      <line x1="30"  y1="0" x2="30"  y2="50"/>
      <line x1="60"  y1="0" x2="60"  y2="50"/>
      <line x1="90"  y1="0" x2="90"  y2="50"/>
      <line x1="120" y1="0" x2="120" y2="50"/>
      <line x1="150" y1="0" x2="150" y2="50"/>
      <line x1="180" y1="0" x2="180" y2="50"/>
      <line x1="210" y1="0" x2="210" y2="50"/>
      <line x1="240" y1="0" x2="240" y2="50"/>
      <line x1="270" y1="0" x2="270" y2="50"/>
      <line x1="300" y1="0" x2="300" y2="50"/>
      <line x1="330" y1="0" x2="330" y2="50"/>
      <line x1="360" y1="0" x2="360" y2="50"/>
      <line x1="390" y1="0" x2="390" y2="50"/>
      <line x1="420" y1="0" x2="420" y2="50"/>
    </g>
    <text x="240" y="29" text-anchor="middle" font-size="12" fill="#1565c0">16 elements of the chosen block</text>
  </g>

  <!-- bottom caption -->
  <text x="480" y="665" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">1 SIMD instruction · 16 equality checks in parallel</text>
  <text x="480" y="685" text-anchor="middle" font-size="12" fill="#666">if any cell matches the target, we're done</text>

</svg>
